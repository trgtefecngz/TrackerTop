name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (headless, warnings are errors)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (with native GUI, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests (with native GUI)
        run: cargo test --verbose
      - name: Build release binary (with native GUI)
        run: cargo build --release

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run headless CLI/MCP tests
        run: cargo test --no-default-features --verbose
      - name: Golden correctness corpus (precision/recall per language)
        run: cargo test --no-default-features --test golden -- --nocapture
      - name: Build headless release binary
        run: cargo build --release --no-default-features

  installer-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh
        run: shellcheck scripts/install.sh
