<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrackerTop WebGPU Demo Host</title>
</head>
<body>
  <canvas id="webgpu-viewport" width="640" height="360"></canvas>
  <button id="reload-shader" onclick="initWebGpuPreview()">Reload Shader</button>
  <script>
    async function initWebGpuPreview() {
      const code = await fetch("shader_demo.wgsl").then(r => r.text());
      return code;
    }
  </script>
</body>
</html>
